<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="Chauffeurs - plusieurs villes">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF6EE"/><stop offset="1" stop-color="#F0DFC0"/>
    </linearGradient>
    <path id="pin" d="M0 0 C-14 -18 -20 -26 -20 -36 A20 20 0 1 1 20 -36 C20 -26 14 -18 0 0Z"/>
  </defs>
  <rect width="800" height="400" fill="url(#sky)"/>

  <!-- skyline of three cities -->
  <g fill="#E1D4B8">
    <rect x="40" y="205" width="46" height="95"/><rect x="92" y="172" width="38" height="128"/><rect x="136" y="220" width="52" height="80"/>
    <rect x="330" y="196" width="40" height="104"/><rect x="376" y="158" width="46" height="142"/><rect x="428" y="210" width="36" height="90"/>
    <rect x="590" y="222" width="50" height="78"/><rect x="646" y="186" width="40" height="114"/><rect x="692" y="226" width="54" height="74"/>
  </g>
  <g fill="#D3C4A2">
    <rect x="100" y="184" width="8" height="10"/><rect x="114" y="184" width="8" height="10"/><rect x="100" y="204" width="8" height="10"/><rect x="114" y="204" width="8" height="10"/>
    <rect x="386" y="170" width="8" height="10"/><rect x="402" y="170" width="8" height="10"/><rect x="386" y="192" width="8" height="10"/><rect x="402" y="192" width="8" height="10"/>
    <rect x="654" y="198" width="8" height="10"/><rect x="668" y="198" width="8" height="10"/><rect x="654" y="218" width="8" height="10"/><rect x="668" y="218" width="8" height="10"/>
  </g>

  <!-- route between cities + pins -->
  <path d="M111 118 Q255 40 399 96 T667 138" fill="none" stroke="#C1272D" stroke-width="4" stroke-dasharray="3 12" stroke-linecap="round"/>
  <g fill="#C1272D">
    <use href="#pin" x="111" y="162"/><use href="#pin" x="399" y="150"/><use href="#pin" x="667" y="178"/>
  </g>
  <g fill="#FAF6EE">
    <circle cx="111" cy="126" r="7"/><circle cx="399" cy="114" r="7"/><circle cx="667" cy="142" r="7"/>
  </g>

  <!-- road -->
  <rect y="300" width="800" height="100" fill="#14110F"/>
  <rect y="296" width="800" height="6" fill="#C89B3C"/>
  <g fill="#FAF6EE" opacity=".85">
    <rect x="30" y="362" width="60" height="6" rx="3"/><rect x="130" y="362" width="60" height="6" rx="3"/>
    <rect x="230" y="372" width="60" height="6" rx="3"/><rect x="330" y="372" width="60" height="6" rx="3"/>
    <rect x="430" y="372" width="60" height="6" rx="3"/><rect x="530" y="372" width="60" height="6" rx="3"/>
    <rect x="630" y="372" width="60" height="6" rx="3"/><rect x="730" y="372" width="60" height="6" rx="3"/>
  </g>

  <!-- truck -->
  <g transform="translate(228,172)">
    <rect x="0" y="0" width="250" height="124" rx="10" fill="#C1272D"/>
    <rect x="0" y="82" width="250" height="14" fill="#FAF6EE" opacity=".92"/>
    <rect x="0" y="96" width="250" height="5" fill="#C89B3C"/>
    <text x="125" y="52" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#FAF6EE">ForsaJobs24</text>
    <path d="M250 22 h48 q16 0 26 14 l24 34 q5 7 5 16 v38 h-103z" fill="#14110F" stroke="#C89B3C" stroke-width="3"/>
    <path d="M262 36 h34 q9 0 15 8 l14 20 h-63z" fill="#F0DFC0"/>
    <rect x="344" y="92" width="12" height="16" rx="3" fill="#C89B3C"/>
    <rect x="-6" y="124" width="372" height="14" rx="4" fill="#0b0908"/>
    <g fill="#14110F" stroke="#FAF6EE" stroke-width="5">
      <circle cx="62" cy="140" r="26"/><circle cx="152" cy="140" r="26"/><circle cx="300" cy="140" r="26"/>
    </g>
    <g fill="#C89B3C"><circle cx="62" cy="140" r="9"/><circle cx="152" cy="140" r="9"/><circle cx="300" cy="140" r="9"/></g>
  </g>

  <!-- licence card -->
  <g transform="translate(22,310) rotate(-3 90 40)">
    <rect width="184" height="80" rx="10" fill="#FAF6EE" stroke="#C89B3C" stroke-width="3"/>
    <rect width="184" height="22" rx="10" fill="#C1272D"/>
    <rect y="12" width="184" height="10" fill="#C1272D"/>
    <text x="92" y="16" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#FAF6EE">PERMIS / LICENCE</text>
    <text x="92" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#14110F">B · C · D · EC</text>
  </g>
</svg>
